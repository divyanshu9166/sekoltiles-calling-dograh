# Production overrides for the separately installed Dograh Docker stack.
# Copy this file beside Dograh's docker-compose.yaml on the VPS.
services:
  nginx:
    extra_hosts:
      - "host.docker.internal:172.18.0.1"

  api:
    extra_hosts:
      - "host.docker.internal:172.18.0.1"
    environment:
      DOGRAH_GROQ_FALLBACK_MODEL: ${DOGRAH_GROQ_FALLBACK_MODEL:-openai/gpt-oss-20b}
      DOGRAH_GROQ_FALLBACK_MAX_COMPLETION_TOKENS: ${DOGRAH_GROQ_FALLBACK_MAX_COMPLETION_TOKENS:-512}
      DOGRAH_GROQ_PRIMARY_MAX_REQUESTS: ${DOGRAH_GROQ_PRIMARY_MAX_REQUESTS:-3}
    volumes:
      - ./groq_model_fallback.py:/app/api/services/pipecat/groq_model_fallback.py:ro
      - ./transfer_consent_guard.py:/app/api/services/workflow/transfer_consent_guard.py:ro
      - ./customer_action_intent_guard.py:/app/api/services/workflow/customer_action_intent_guard.py:ro
    command:
      - sh
      - -c
      - |
        sed -i -E 's/GroqLLMSettings\(model=model, temperature=0\.1(, max_completion_tokens=[0-9]+)?\)/GroqLLMSettings(model=model, temperature=0.1, max_completion_tokens=192)/' /app/api/services/pipecat/service_factory.py
        grep -q 'groq_model_fallback import FallbackGroqLLMService' /app/api/services/pipecat/service_factory.py || sed -i '/from pipecat.services.groq.llm import GroqLLMService, GroqLLMSettings/a from api.services.pipecat.groq_model_fallback import FallbackGroqLLMService' /app/api/services/pipecat/service_factory.py
        sed -i 's/return GroqLLMService(/return FallbackGroqLLMService(/' /app/api/services/pipecat/service_factory.py
        grep -q 'install_transfer_consent_guard(CustomToolManager)' /app/api/services/workflow/pipecat_engine_custom_tools.py || printf '\nfrom api.services.workflow.transfer_consent_guard import install_transfer_consent_guard\ninstall_transfer_consent_guard(CustomToolManager)\n' >> /app/api/services/workflow/pipecat_engine_custom_tools.py
        grep -q 'install_customer_action_intent_guard(CustomToolManager)' /app/api/services/workflow/pipecat_engine_custom_tools.py || printf '\nfrom api.services.workflow.customer_action_intent_guard import install_customer_action_intent_guard\ninstall_customer_action_intent_guard(CustomToolManager)\n' >> /app/api/services/workflow/pipecat_engine_custom_tools.py
        exec ./scripts/start_services_docker.sh
